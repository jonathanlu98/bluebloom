name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: You can write in English or Chinese (中文也可以).
  - type: textarea
    id: problem
    attributes:
      label: What would you like Blue Bloom to do?
      description: Describe the problem or the use case first, then the idea.
    validations:
      required: true
  - type: input
    id: headphones
    attributes:
      label: Headphones (if it's about specific headphones)
